[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "atlas-lookup"
dynamic = ["version"]
description = "Which brain region is this MNI coordinate in? Multi-atlas lookup, a three-plane viewer, SPM T-map clusters, and a quiz for learning regions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Nam Anh Nguyen" }]
requires-python = ">=3.10"
keywords = ["neuroimaging", "fMRI", "atlas", "MNI", "SPM", "Brodmann", "Harvard-Oxford", "Juelich"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Operating System :: OS Independent",
]
dependencies = [
  "nibabel>=5.2",
  "nilearn>=0.11",
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
atlaslookup = "atlaslookup.__main__:main"

[tool.hatch.version]
path = "src/atlaslookup/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlaslookup"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
